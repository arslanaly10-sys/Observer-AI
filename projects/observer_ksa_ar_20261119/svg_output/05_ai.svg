<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="ar-SA" data-pptx-page-role="content" font-family="Segoe UI, IBM Plex Sans Arabic" text-anchor="end">
<defs><radialGradient id="glow" cx="0.75" cy="0.25" r="0.5"><stop offset="0%" stop-color="#7A5A2B" stop-opacity="0.45"/><stop offset="100%" stop-color="#0F0D0A" stop-opacity="0"/></radialGradient></defs>
<rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0F0D0A"/>
<rect id="glow-layer" data-pptx-role="decoration" x="0" y="0" width="1280" height="720" fill="url(#glow)"/>
<g id="header" data-pptx-bounds="280 66 920 220"><text x="1200" y="96" font-size="17" fill="#CDB284" font-weight="bold">الذكاء الاصطناعي في المنصة</text><rect x="785" y="76" width="118" height="28" rx="14" fill="#CDB284" fill-opacity="0.16" stroke="#CDB284" stroke-width="1"/><text x="844" y="95" font-size="14" fill="#CDB284" font-weight="bold" text-anchor="middle">ذكاء اصطناعي</text><text x="1200" y="180" font-size="60" fill="#F5F1EA" font-family="Times New Roman, Amiri" font-weight="bold">مستشار ذكي لا ينام</text><text x="1200" y="242" font-size="22" fill="#BDB3A3">يرد ويؤهّل ويتابع ويحجز المعاينات، ثم يسلّم العميل الجاهز<tspan x="1200" dy="34">لفريقكم</tspan></text></g><g id="ai-1" data-pptx-bounds="840 322 360 140"><rect x="840" y="322" width="360" height="140" rx="16" fill="#1B1813" stroke="#CDB284" stroke-opacity="0.35" stroke-width="1"/><circle cx="1166" cy="360" r="8" fill="#CDB284"/><text x="1144" y="368" font-size="22" fill="#F5F1EA" font-weight="bold">رد فوري على واتساب</text><text x="1174" y="408" font-size="17" fill="#BDB3A3">بلهجة العميل وخلال أقل من<tspan x="1174" dy="26">دقيقة، ليلاً ونهاراً</tspan></text></g><g id="ai-2" data-pptx-bounds="450 322 360 140"><rect x="450" y="322" width="360" height="140" rx="16" fill="#1B1813" stroke="#CDB284" stroke-opacity="0.35" stroke-width="1"/><circle cx="776" cy="360" r="8" fill="#CDB284"/><text x="754" y="368" font-size="22" fill="#F5F1EA" font-weight="bold">تقييم ذكي للعملاء</text><text x="784" y="408" font-size="17" fill="#BDB3A3">سبع إشارات تحدد من يستحق<tspan x="784" dy="26">الاتصال أولاً</tspan></text></g><g id="ai-3" data-pptx-bounds="60 322 360 140"><rect x="60" y="322" width="360" height="140" rx="16" fill="#1B1813" stroke="#CDB284" stroke-opacity="0.35" stroke-width="1"/><circle cx="386" cy="360" r="8" fill="#CDB284"/><text x="364" y="368" font-size="22" fill="#F5F1EA" font-weight="bold">مساعد صوتي</text><text x="394" y="408" font-size="17" fill="#BDB3A3">يرد على المكالمات الفائتة<tspan x="394" dy="26">ويحجز المعاينة</tspan></text></g><g id="ai-4" data-pptx-bounds="840 486 360 140"><rect x="840" y="486" width="360" height="140" rx="16" fill="#1B1813" stroke="#CDB284" stroke-opacity="0.35" stroke-width="1"/><circle cx="1166" cy="524" r="8" fill="#CDB284"/><text x="1144" y="532" font-size="22" fill="#F5F1EA" font-weight="bold">الإجراء التالي الأفضل</text><text x="1174" y="572" font-size="17" fill="#BDB3A3">قائمة يومية لكل مستشار مرتبة<tspan x="1174" dy="26">حسب قيمة الفرصة</tspan></text></g><g id="ai-5" data-pptx-bounds="450 486 360 140"><rect x="450" y="486" width="360" height="140" rx="16" fill="#1B1813" stroke="#CDB284" stroke-opacity="0.35" stroke-width="1"/><circle cx="776" cy="524" r="8" fill="#CDB284"/><text x="754" y="532" font-size="22" fill="#F5F1EA" font-weight="bold">متابعة لا تنسى</text><text x="784" y="572" font-size="17" fill="#BDB3A3">رسائل في اليوم الأول والثالث<tspan x="784" dy="26">والسابع حتى يرد العميل</tspan></text></g><g id="ai-6" data-pptx-bounds="60 486 360 140"><rect x="60" y="486" width="360" height="140" rx="16" fill="#1B1813" stroke="#CDB284" stroke-opacity="0.35" stroke-width="1"/><circle cx="386" cy="524" r="8" fill="#CDB284"/><text x="364" y="532" font-size="22" fill="#F5F1EA" font-weight="bold">ليلة الإطلاق</text><text x="394" y="572" font-size="17" fill="#BDB3A3">آلاف الاستفسارات في ساعة<tspan x="394" dy="26">واحدة، دون أن يضيع أحد</tspan></text></g><g id="footer" data-pptx-bounds="80 676 300 24"><text x="80" y="694" font-size="13" fill="#BDB3A3" text-anchor="start" letter-spacing="2">OBSERVER AI</text></g>
</svg>
