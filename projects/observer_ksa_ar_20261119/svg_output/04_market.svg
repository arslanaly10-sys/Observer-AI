<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="ar-SA" data-pptx-page-role="content" font-family="Segoe UI, IBM Plex Sans Arabic" text-anchor="end">
<defs></defs>
<rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F5F1EA"/>
<image id="aerial" data-pptx-role="background" href="../images/riyadh_aerial.jpg" x="0" y="0" width="460" height="720" preserveAspectRatio="xMidYMid slice"/>
<g id="header" data-pptx-bounds="540 70 660 193"><text x="1200" y="100" font-size="17" fill="#7A5A2B" font-weight="bold">السوق السعودي</text><text x="1200" y="176" font-size="52" fill="#1C1914" font-family="Times New Roman, Amiri" font-weight="bold">سوق يتسارع، وفرق<tspan x="1200" dy="65">مبيعات تحت ضغط</tspan></text></g><g id="drivers" data-pptx-bounds="540 281 660 230"><rect x="1197" y="287" width="3" height="86" fill="#CDB284"/><text x="1180" y="307" font-size="21" fill="#1C1914" font-weight="bold">رؤية 2030 وبرنامج الإسكان</text><text x="1180" y="339" font-size="18" fill="#5E564B">بحلول عام 2030 تستهدف المملكة أن تتملك 70% من الأسر<tspan x="1180" dy="28">السعودية مساكنها</tspan></text><rect x="1197" y="397" width="3" height="86" fill="#CDB284"/><text x="1180" y="417" font-size="21" fill="#1C1914" font-weight="bold">البيع على الخارطة</text><text x="1180" y="449" font-size="18" fill="#5E564B">مشاريع مرخّصة عبر برنامج وافي، بدفعات ومستندات تحتاج<tspan x="1180" dy="28">إلى متابعة دقيقة</tspan></text></g><g id="developers" data-pptx-bounds="540 513 660 180"><text x="1200" y="539" font-size="21" fill="#1C1914" font-weight="bold">مطورون يطلقون مشاريعهم على نطاق واسع</text><rect x="1108" y="561" width="92" height="38" rx="19" fill="#ECE5D8" stroke="#CDB284" stroke-opacity="0.6" stroke-width="1"/><text x="1154" y="586" font-size="16" fill="#1C1914" text-anchor="middle">روشن</text><rect x="915" y="561" width="183" height="38" rx="19" fill="#ECE5D8" stroke="#CDB284" stroke-opacity="0.6" stroke-width="1"/><text x="1006" y="586" font-size="16" fill="#1C1914" text-anchor="middle">دار الأركان</text><rect x="800" y="561" width="105" height="38" rx="19" fill="#ECE5D8" stroke="#CDB284" stroke-opacity="0.6" stroke-width="1"/><text x="852" y="586" font-size="16" fill="#1C1914" text-anchor="middle">ريتال</text><rect x="555" y="561" width="235" height="38" rx="19" fill="#ECE5D8" stroke="#CDB284" stroke-opacity="0.6" stroke-width="1"/><text x="672" y="586" font-size="16" fill="#1C1914" text-anchor="middle">الوطنية للإسكان</text><rect x="1056" y="609" width="144" height="38" rx="19" fill="#ECE5D8" stroke="#CDB284" stroke-opacity="0.6" stroke-width="1"/><text x="1128" y="634" font-size="16" fill="#1C1914" text-anchor="middle">العقارية</text><rect x="915" y="609" width="131" height="38" rx="19" fill="#ECE5D8" stroke="#CDB284" stroke-opacity="0.6" stroke-width="1"/><text x="980" y="634" font-size="16" fill="#1C1914" text-anchor="middle">جبل عمر</text><text x="1200" y="681" font-size="13" fill="#5E564B">أسماء المطورين للإشارة إلى السوق فقط، ولا تعني شراكة أو علاقة تجارية</text></g>
</svg>
