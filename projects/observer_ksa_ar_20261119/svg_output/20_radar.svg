<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="ar-SA" data-pptx-page-role="content" font-family="Segoe UI, IBM Plex Sans Arabic" text-anchor="end">
<defs><filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.14"/></filter><clipPath id="clip-screen"><rect x="80" y="150" width="640" height="400" rx="10"/></clipPath></defs>
<rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0F0D0A"/>
<g id="header" data-pptx-bounds="770 66 430 285"><text x="1200" y="96" font-size="17" fill="#CDB284" font-weight="bold">رادار الطلب</text><rect x="942" y="76" width="118" height="28" rx="14" fill="#CDB284" fill-opacity="0.16" stroke="#CDB284" stroke-width="1"/><text x="1002" y="95" font-size="14" fill="#CDB284" font-weight="bold" text-anchor="middle">ذكاء اصطناعي</text><text x="1200" y="164" font-size="44" fill="#F5F1EA" font-family="Times New Roman, Amiri" font-weight="bold">ما يريده<tspan x="1200" dy="55">المشترون قبل</tspan><tspan x="1200" dy="55">تسعير الإطلاق</tspan><tspan x="1200" dy="55">القادم</tspan></text></g><g id="points" data-pptx-bounds="770 365 430 362"><rect x="1197" y="371" width="3" height="114" fill="#CDB284"/><text x="1180" y="391" font-size="21" fill="#F5F1EA" font-weight="bold">طلب مجهّل الهوية</text><text x="1180" y="423" font-size="18" fill="#BDB3A3">حسب المنطقة والغرف والميزانية، من<tspan x="1180" dy="28">عملاء وافقوا، ودون مجموعات أقل من</tspan><tspan x="1180" dy="28">خمسة</tspan></text><rect x="1197" y="507" width="3" height="86" fill="#CDB284"/><text x="1180" y="527" font-size="21" fill="#F5F1EA" font-weight="bold">بيانات عامة لا واجهات برمجية</text><text x="1180" y="559" font-size="18" fill="#BDB3A3">بيانات دائرة الأراضي ومنصات التجميع<tspan x="1180" dy="28">ووحدات إعادة البيع ورسائل المطورين</tspan></text><rect x="1197" y="615" width="3" height="86" fill="#CDB284"/><text x="1180" y="635" font-size="21" fill="#F5F1EA" font-weight="bold">سبب للمشاركة</text><text x="1180" y="667" font-size="18" fill="#BDB3A3">مكالمات أقل، ومشترون ملتزمون<tspan x="1180" dy="28">صباحاً، ومؤشرات لتسعير الإطلاق</tspan></text></g><g id="screen" data-pptx-bounds="72 142 656 416"><rect x="72" y="142" width="656" height="416" rx="16" fill="#2A251E" stroke="#CDB284" stroke-opacity="0.45" stroke-width="1" filter="url(#lift)"/><image href="../images/ar_radar.jpg" x="80" y="150" width="640" height="400" preserveAspectRatio="xMidYMin slice" clip-path="url(#clip-screen)"/></g><g id="footer" data-pptx-bounds="80 676 300 24"><text x="80" y="694" font-size="13" fill="#BDB3A3" text-anchor="start" letter-spacing="2">OBSERVER AI</text></g>
</svg>
