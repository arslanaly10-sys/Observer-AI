<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="ar-SA" data-pptx-page-role="content" font-family="Segoe UI, IBM Plex Sans Arabic" text-anchor="end">
<defs><filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.14"/></filter><clipPath id="clip-screen"><rect x="80" y="150" width="640" height="400" rx="10"/></clipPath></defs>
<rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F5F1EA"/>
<g id="header" data-pptx-bounds="770 66 430 230"><text x="1200" y="96" font-size="17" fill="#7A5A2B" font-weight="bold">مخزون دون واجهة برمجية</text><rect x="827" y="76" width="118" height="28" rx="14" fill="#CDB284" fill-opacity="0.16" stroke="#CDB284" stroke-width="1"/><text x="886" y="95" font-size="14" fill="#7A5A2B" font-weight="bold" text-anchor="middle">ذكاء اصطناعي</text><text x="1200" y="164" font-size="44" fill="#1C1914" font-family="Times New Roman, Amiri" font-weight="bold">لا واجهة<tspan x="1200" dy="55">برمجية؟ لا</tspan><tspan x="1200" dy="55">مشكلة</tspan></text></g><g id="points" data-pptx-bounds="770 310 430 390"><rect x="1197" y="316" width="3" height="114" fill="#CDB284"/><text x="1180" y="336" font-size="21" fill="#1C1914" font-weight="bold">ست طرق للربط</text><text x="1180" y="368" font-size="18" fill="#5E564B">مزامنة نظام العملاء، أو قائمة<tspan x="1180" dy="28">أسعار، أو بريد، أو بوابة المطور، أو</tspan><tspan x="1180" dy="28">جدول مشترك، أو يدوياً</tspan></text><rect x="1197" y="452" width="3" height="114" fill="#CDB284"/><text x="1180" y="472" font-size="21" fill="#1C1914" font-weight="bold">حداثة كل وحدة</text><text x="1180" y="504" font-size="18" fill="#5E564B">أقل من ست ساعات يذكر الذكاء<tspan x="1180" dy="28">الاصطناعي السعر، وحتى يوم يذكره مع</tspan><tspan x="1180" dy="28">التاريخ</tspan></text><rect x="1197" y="588" width="3" height="86" fill="#CDB284"/><text x="1180" y="608" font-size="21" fill="#1C1914" font-weight="bold">لا أسعار قديمة</text><text x="1180" y="640" font-size="18" fill="#5E564B">إذا تجاوز عمر البيانات يوماً يسأل<tspan x="1180" dy="28">إدارة المبيعات قبل أي إجابة</tspan></text></g><g id="screen" data-pptx-bounds="72 142 656 416"><rect x="72" y="142" width="656" height="416" rx="16" fill="#FFFFFF" stroke="#CDB284" stroke-opacity="0.45" stroke-width="1" filter="url(#lift)"/><image href="../images/ar_sources.jpg" x="80" y="150" width="640" height="400" preserveAspectRatio="xMidYMin slice" clip-path="url(#clip-screen)"/></g><g id="footer" data-pptx-bounds="80 676 300 24"><text x="80" y="694" font-size="13" fill="#5E564B" text-anchor="start" letter-spacing="2">OBSERVER AI</text></g>
</svg>
