<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="ar-SA" data-pptx-page-role="content" font-family="Segoe UI, IBM Plex Sans Arabic" text-anchor="end">
<defs></defs>
<rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F5F1EA"/>
<image id="najdi" data-pptx-role="background" href="../images/balcony.jpg" x="0" y="0" width="500" height="720" preserveAspectRatio="xMidYMid slice"/>
<g id="header" data-pptx-bounds="580 70 620 188"><text x="1200" y="100" font-size="17" fill="#7A5A2B" font-weight="bold">صُنع للمملكة</text><text x="1200" y="174" font-size="50" fill="#1C1914" font-family="Times New Roman, Amiri" font-weight="bold">مصمم لطريقة البيع<tspan x="1200" dy="62">في السوق السعودي</tspan></text></g><g id="points" data-pptx-bounds="580 276 620 446"><rect x="1197" y="282" width="3" height="86" fill="#CDB284"/><text x="1180" y="302" font-size="21" fill="#1C1914" font-weight="bold">عربي أولاً</text><text x="1180" y="334" font-size="18" fill="#5E564B">واجهة عربية كاملة، وردود باللهجة السعودية أو<tspan x="1180" dy="28">الخليجية أو بالإنجليزية حسب العميل</tspan></text><rect x="1197" y="390" width="3" height="86" fill="#CDB284"/><text x="1180" y="410" font-size="21" fill="#1C1914" font-weight="bold">صلاحيات حسب الدور</text><text x="1180" y="442" font-size="18" fill="#5E564B">رئيس مجلس الإدارة والمدير والمستشار والوسيط، كلٌ<tspan x="1180" dy="28">يرى ما يخصه فقط</tspan></text><rect x="1197" y="498" width="3" height="86" fill="#CDB284"/><text x="1180" y="518" font-size="21" fill="#1C1914" font-weight="bold">خصوصية كبار العملاء</text><text x="1180" y="550" font-size="18" fill="#5E564B">وضع خاص يخفي أسماء العملاء على الشاشة، وسجل لكل<tspan x="1180" dy="28">إجراء</tspan></text><rect x="1197" y="606" width="3" height="86" fill="#CDB284"/><text x="1180" y="626" font-size="21" fill="#1C1914" font-weight="bold">حماية البيانات</text><text x="1180" y="658" font-size="18" fill="#5E564B">نراجع معكم متطلبات نظام حماية البيانات الشخصية قبل<tspan x="1180" dy="28">الإطلاق</tspan></text></g>
</svg>
