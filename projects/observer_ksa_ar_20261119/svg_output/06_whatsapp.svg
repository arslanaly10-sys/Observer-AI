<g id="header" data-pptx-bounds="770 66 430 175"><text x="1200" y="96" font-size="17" fill="#7A5A2B" font-weight="bold">واتساب</text><rect x="995" y="76" width="118" height="28" rx="14" fill="#CDB284" fill-opacity="0.16" stroke="#CDB284" stroke-width="1"/><text x="1054" y="95" font-size="14" fill="#7A5A2B" font-weight="bold" text-anchor="middle">ذكاء اصطناعي</text><text x="1200" y="164" font-size="44" fill="#1C1914" font-family="Times New Roman, Amiri" font-weight="bold">يرد خلال دقيقة<tspan x="1200" dy="55">وبلغة العميل</tspan></text></g><g id="points" data-pptx-bounds="770 255 430 334"><rect x="1197" y="261" width="3" height="86" fill="#CDB284"/><text x="1180" y="281" font-size="21" fill="#1C1914" font-weight="bold">يفهم الطلب</text><text x="1180" y="313" font-size="18" fill="#5E564B">الميزانية والحي ونوع الوحدة وموعد<tspan x="1180" dy="28">الانتقال، من رسالة واحدة</tspan></text><rect x="1197" y="369" width="3" height="86" fill="#CDB284"/><text x="1180" y="389" font-size="21" fill="#1C1914" font-weight="bold">يرسل الوحدات المطابقة</text><text x="1180" y="421" font-size="18" fill="#5E564B">من مخزونكم الفعلي، بالأسعار وخطط<tspan x="1180" dy="28">الدفع المعتمدة</tspan></text><rect x="1197" y="477" width="3" height="86" fill="#CDB284"/><text x="1180" y="497" font-size="21" fill="#1C1914" font-weight="bold">يحجز المعاينة</text><text x="1180" y="529" font-size="18" fill="#5E564B">ويُعلم المستشار المناسب بملخص كامل<tspan x="1180" dy="28">للمحادثة</tspan></text></g><g id="note" data-pptx-bounds="770 599 430 101"><rect x="770" y="605" width="430" height="1" fill="#CDB284" fill-opacity="0.6"/><text x="1200" y="635" font-size="15" fill="#7A5A2B">يعرّف بنفسه دائماً كمساعد ذكي، ولا يدّعي أنه<tspan x="1200" dy="22">إنسان</tspan></text></g><g id="screen" data-pptx-bounds="72 142 656 416"><rect x="72" y="142" width="656" height="416" rx="16" fill="#FFFFFF" stroke="#CDB284" stroke-opacity="0.45" stroke-width="1" filter="url(#lift)"/><image href="../images/ar_whatsapp.jpg" x="80" y