<g id="header" data-pptx-bounds="770 66 430 175"><text x="1200" y="96" font-size="17" fill="#7A5A2B" font-weight="bold">تقييم العملاء</text><rect x="922" y="76" width="118" height="28" rx="14" fill="#CDB284" fill-opacity="0.16" stroke="#CDB284" stroke-width="1"/><text x="980" y="95" font-size="14" fill="#7A5A2B" font-weight="bold" text-anchor="middle">ذكاء اصطناعي</text><text x="1200" y="164" font-size="44" fill="#1C1914" font-family="Times New Roman, Amiri" font-weight="bold">تقييم يستطيع<tspan x="1200" dy="55">فريقكم مراجعته</tspan></text></g><g id="points" data-pptx-bounds="770 255 430 282"><rect x="1197" y="261" width="3" height="114" fill="#CDB284"/><text x="1180" y="281" font-size="21" fill="#1C1914" font-weight="bold">سبع إشارات</text><text x="1180" y="313" font-size="18" fill="#5E564B">التفاعل، ملاءمة الميزانية، توقيت<tspan x="1180" dy="28">الشراء، سرعة الرد، الطلب على الحي</tspan><tspan x="1180" dy="28">جودة المصدر، جاهزية التمويل</tspan></text><rect x="1197" y="397" width="3" height="114" fill="#CDB284"/><text x="1180" y="417" font-size="21" fill="#1C1914" font-weight="bold">أوزان تحددونها</text><text x="1180" y="449" font-size="18" fill="#5E564B">قيادة المبيعات تقرر ما يهم<tspan x="1180" dy="28">والمستشار يعدّل التقييم مع حفظ</tspan><tspan x="1180" dy="28">السبب</tspan></text></g><g id="note" data-pptx-bounds="770 547 430 153"><rect x="770" y="553" width="430" height="1" fill="#CDB284" fill-opacity="0.6"/><text x="1200" y="583" font-size="15" fill="#7A5A2B">التقييم الذي لا يشرح نفسه لا يثق به أحد<tspan x="1200" dy="22">وتقييمنا يُظهر أسبابه</tspan></text></g><g id="screen" data-pptx-bounds="72 142 656 416"><rect x="72" y="142" width="656" height="416" rx="16" fill="#FFFFFF" stroke="#CDB284" stroke-opacity="0.45" stroke-width="1" filter="url(#lift)"/><image href="../images/ar_scoring.jpg" x="80" y="150" width="640" height="400" preserveAspectRatio="xMidYMin slice" clip-path="url(#clip-screen)"/></g><g id="footer" data-pptx-bounds="80 676 300 24"><text x="80" y="694" font-size="13" fill="#5E564B" text-anchor="start" letter-spacing="2">OBSERVER AI</text></g>
