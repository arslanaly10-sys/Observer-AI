<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="ar-SA" data-pptx-page-role="content" font-family="Segoe UI, IBM Plex Sans Arabic" text-anchor="end">
<defs><filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.14"/></filter><clipPath id="clip-screen"><rect x="80" y="150" width="640" height="400" rx="10"/></clipPath></defs>
<rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#0F0D0A"/>
<g id="header" data-pptx-bounds="770 66 430 230"><text x="1200" y="96" font-size="17" fill="#CDB284" font-weight="bold">منتصف الليل في دبي</text><rect x="869" y="76" width="118" height="28" rx="14" fill="#CDB284" fill-opacity="0.16" stroke="#CDB284" stroke-width="1"/><text x="928" y="95" font-size="14" fill="#CDB284" font-weight="bold" text-anchor="middle">ذكاء اصطناعي</text><text x="1200" y="164" font-size="44" fill="#F5F1EA" font-family="Times New Roman, Amiri" font-weight="bold">العميل يلتزم<tspan x="1200" dy="55">ليلاً، والصفقة</tspan><tspan x="1200" dy="55">جاهزة صباحاً</tspan></text></g><g id="points" data-pptx-bounds="770 310 430 334"><rect x="1197" y="316" width="3" height="86" fill="#CDB284"/><text x="1180" y="336" font-size="21" fill="#F5F1EA" font-weight="bold">لا يذكر إلا ما هو متأكد منه</text><text x="1180" y="368" font-size="18" fill="#BDB3A3">تأكد 80% على الأقل ليلاً، وإلا يؤكد<tspan x="1180" dy="28">أولاً ويعرض بديلين مؤكدين</tspan></text><rect x="1197" y="424" width="3" height="86" fill="#CDB284"/><text x="1180" y="444" font-size="21" fill="#F5F1EA" font-weight="bold">المستندات وعربون المطور</text><text x="1180" y="476" font-size="18" fill="#BDB3A3">يقرأ الجواز وإثبات الأموال، ويذهب<tspan x="1180" dy="28">العربون المسترد إلى المطور مباشرة</tspan></text><rect x="1197" y="532" width="3" height="86" fill="#CDB284"/><text x="1180" y="552" font-size="21" fill="#F5F1EA" font-weight="bold">الأول في الطابور صباحاً</text><text x="1180" y="584" font-size="18" fill="#BDB3A3">يُدرج طلب الحجز لحظة فتح مكتب<tspan x="1180" dy="28">المطور</tspan></text></g><g id="screen" data-pptx-bounds="72 142 656 416"><rect x="72" y="142" width="656" height="416" rx="16" fill="#2A251E" stroke="#CDB284" stroke-opacity="0.45" stroke-width="1" filter="url(#lift)"/><image href="../images/ar_overnight.jpg" x="80" y="150" width="640" height="400" preserveAspectRatio="xMidYMin slice" clip-path="url(#clip-screen)"/></g><g id="footer" data-pptx-bounds="80 676 300 24"><text x="80" y="694" font-size="13" fill="#BDB3A3" text-anchor="start" letter-spacing="2">OBSERVER AI</text></g>
</svg>
