<g id="header" data-pptx-bounds="580 100 620 238"><text x="1200" y="110" font-size="17" fill="#CDB284" font-weight="bold">لحظة تتكرر كل ليلة</text><text x="1200" y="186" font-size="52" fill="#F5F1EA" font-family="Times New Roman, Amiri" font-weight="bold">الساعة 11:47 مساءً<tspan x="1200" dy="65">عميل يسأل عن فيلا</tspan><tspan x="1200" dy="65">في شمال الرياض</tspan></text></g><g id="story" data-pptx-bounds="580 350 620 130"><text x="1200" y="382" font-size="23" fill="#BDB3A3">ميزانيته أربعة ملايين ريال، والتمويل جاهز<tspan x="1200" dy="36">ويريد المعاينة هذا الأسبوع</tspan></text><text x="1200" y="466" font-size="23" fill="#F5F1EA" font-weight="bold">يصله الرد في التاسعة صباحاً، وقد حجز لدى مطور آخر</text></g><g id="takeaway" data-pptx-bounds="580 590 620 60"><rect x="600" y="596" width="600" height="1" fill="#CDB284" fill-opacity="0.5"/><text x="1200" y="636" font-size="22" fill="#CDB284" font-weight="bold">في سوق يتحرك بهذه السرعة، الدقيقة الأولى هي الصفقة</text></g><g id="footer" data-pptx-bounds="80 676 300 24"><text x="80" y="694" font-size="13" fill="#BDB3A3" text-anchor="start" letter-spacing="2">OBSERVER AI</text></g>
</svg>
