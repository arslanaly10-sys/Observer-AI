<g id="header" data-pptx-bounds="770 66 430 175"><text x="1200" y="96" font-size="17" fill="#CDB284" font-weight="bold">القرار لكم</text><rect x="953" y="76" width="118" height="28" rx="14" fill="#CDB284" fill-opacity="0.16" stroke="#CDB284" stroke-width="1"/><text x="1012" y="95" font-size="14" fill="#CDB284" font-weight="bold" text-anchor="middle">ذكاء اصطناعي</text><text x="1200" y="164" font-size="44" fill="#F5F1EA" font-family="Times New Roman, Amiri" font-weight="bold">لا شيء مهم يحدث<tspan x="1200" dy="55">دون إنسان</tspan></text></g><g id="points" data-pptx-bounds="770 255 430 362"><rect x="1197" y="261" width="3" height="86" fill="#CDB284"/><text x="1180" y="281" font-size="21" fill="#F5F1EA" font-weight="bold">وافق أو عدّل أو ألغِ</text><text x="1180" y="313" font-size="18" fill="#BDB3A3">حجز الوحدات والخصومات تنتظر قراركم<tspan x="1180" dy="28">مع مسودة جاهزة من الذكاء الاصطناعي</tspan></text><rect x="1197" y="369" width="3" height="114" fill="#CDB284"/><text x="1180" y="389" font-size="21" fill="#F5F1EA" font-weight="bold">استقلالية تحددونها</text><text x="1180" y="421" font-size="18" fill="#BDB3A3">تلقائي، أو بعد الموافقة، أو متوقف<tspan x="1180" dy="28">لكل نوع من الإجراءات، وكل تغيير</tspan><tspan x="1180" dy="28">مسجّل</tspan></text><rect x="1197" y="505" width="3" height="86" fill="#CDB284"/><text x="1180" y="525" font-size="21" fill="#F5F1EA" font-weight="bold">شفافية مع العميل</text><text x="1180" y="557" font-size="18" fill="#BDB3A3">المساعد يعرّف بنفسه دائماً، والعميل<tspan x="1180" dy="28">يطلب مستشاراً في أي لحظة</tspan></text></g><g id="screen" data-pptx-bounds="72 142 656 416"><rect x="72" y="142" width="656" height="416" rx="16" fill="#2A251E" stroke="#CDB284" stroke-opacity="0.45" stroke-width="1" filter="url(#lift)"/><image href="../images/ar_ai.jpg" x="80" y="150" width="640" height="400" preserveAspectRatio="xMidYMin slice" clip-path="url(#clip-screen)"/></g><g id="footer" data-pptx-bounds="80 676 300 24"><text x="80" y="694" font-size="13" fill="#BDB3A3" text-anchor="start" letter-spacing="2">OBSERVER AI</text></g>
</svg>
