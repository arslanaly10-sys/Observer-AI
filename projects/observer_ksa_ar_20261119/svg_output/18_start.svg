<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="ar-SA" data-pptx-page-role="content" font-family="Segoe UI, IBM Plex Sans Arabic" text-anchor="end">
<defs></defs>
<rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F5F1EA"/>
<g id="header" data-pptx-bounds="200 80 1000 188"><text x="1200" y="110" font-size="17" fill="#7A5A2B" font-weight="bold">كيف نبدأ</text><text x="1200" y="184" font-size="50" fill="#1C1914" font-family="Times New Roman, Amiri" font-weight="bold">من أول لقاء إلى التشغيل، في<tspan x="1200" dy="62">أسابيع لا في أرباع سنة</tspan></text></g><g id="step-1" data-pptx-bounds="938 318 262 300"><rect x="938" y="318" width="262" height="300" rx="18" fill="#FFFFFF" stroke="#D9CFBF" stroke-width="1"/><circle cx="1154" cy="370" r="20" fill="#0F0D0A"/><text x="1154" y="378" font-size="20" fill="#CDB284" font-weight="bold" text-anchor="middle">1</text><text x="1172" y="430" font-size="15" fill="#7A5A2B" font-weight="bold">الخطوة الأولى</text><text x="1172" y="466" font-size="23" fill="#1C1914" font-weight="bold">عرض باستفساراتكم</text><text x="1172" y="506" font-size="17" fill="#5E564B">ثلاثون دقيقة، نحمّل<tspan x="1172" dy="27">فيها أسبوعاً من</tspan><tspan x="1172" dy="27">استفساراتكم ونريكم</tspan><tspan x="1172" dy="27">من كان يجب الاتصال</tspan><tspan x="1172" dy="27">به أولاً</tspan></text></g><g id="step-2" data-pptx-bounds="652 318 262 300"><rect x="652" y="318" width="262" height="300" rx="18" fill="#FFFFFF" stroke="#D9CFBF" stroke-width="1"/><circle cx="868" cy="370" r="20" fill="#0F0D0A"/><text x="868" y="378" font-size="20" fill="#CDB284" font-weight="bold" text-anchor="middle">2</text><text x="886" y="430" font-size="15" fill="#7A5A2B" font-weight="bold">الخطوة الثانية</text><text x="886" y="466" font-size="23" fill="#1C1914" font-weight="bold">واتساب للأعمال</text><text x="886" y="506" font-size="17" fill="#5E564B">نجهّز معكم الحساب<tspan x="886" dy="27">والقوالب المعتمدة</tspan><tspan x="886" dy="27">من واتساب</tspan></text></g><g id="step-3" data-pptx-bounds="366 318 262 300"><rect x="366" y="318" width="262" height="300" rx="18" fill="#FFFFFF" stroke="#D9CFBF" stroke-width="1"/><circle cx="582" cy="370" r="20" fill="#0F0D0A"/><text x="582" y="378" font-size="20" fill="#CDB284" font-weight="bold" text-anchor="middle">3</text><text x="600" y="430" font-size="15" fill="#7A5A2B" font-weight="bold">الخطوة الثالثة</text><text x="600" y="466" font-size="23" fill="#1C1914" font-weight="bold">المصادر والمخزون</text><text x="600" y="506" font-size="17" fill="#5E564B">ربط المنصات<tspan x="600" dy="27">العقارية والإعلانات</tspan><tspan x="600" dy="27">والموقع، وتحميل</tspan><tspan x="600" dy="27">المشاريع والأسعار</tspan><tspan x="600" dy="27">وخطط الدفع</tspan></text></g><g id="step-4" data-pptx-bounds="80 318 262 300"><rect x="80" y="318" width="262" height="300" rx="18" fill="#FFFFFF" stroke="#D9CFBF" stroke-width="1"/><circle cx="296" cy="370" r="20" fill="#0F0D0A"/><text x="296" y="378" font-size="20" fill="#CDB284" font-weight="bold" text-anchor="middle">4</text><text x="314" y="430" font-size="15" fill="#7A5A2B" font-weight="bold">الخطوة الرابعة</text><text x="314" y="466" font-size="23" fill="#1C1914" font-weight="bold">تشغيل بضوابط</text><text x="314" y="506" font-size="17" fill="#5E564B">يطلب الموافقة على<tspan x="314" dy="27">الحجوزات والأسعار</tspan><tspan x="314" dy="27">وكبار العملاء حتى</tspan><tspan x="314" dy="27">يثق به فريقكم</tspan></text></g><g id="footer" data-pptx-bounds="80 676 300 24"><text x="80" y="694" font-size="13" fill="#5E564B" text-anchor="start" letter-spacing="2">OBSERVER AI</text></g>
</svg>
