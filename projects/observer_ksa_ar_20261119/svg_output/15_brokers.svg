<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="ar-SA" data-pptx-page-role="content" font-family="Segoe UI, IBM Plex Sans Arabic" text-anchor="end">
<defs><filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.14"/></filter><clipPath id="clip-screen"><rect x="80" y="150" width="640" height="400" rx="10"/></clipPath></defs>
<rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F5F1EA"/>
<g id="header" data-pptx-bounds="770 66 430 175"><text x="1200" y="96" font-size="17" fill="#7A5A2B" font-weight="bold">وكالات كثيرة ومشروع واحد</text><text x="1200" y="164" font-size="44" fill="#1C1914" font-family="Times New Roman, Amiri" font-weight="bold">لا خلاف على من<tspan x="1200" dy="55">جاء بالعميل</tspan></text></g><g id="points" data-pptx-bounds="770 255 430 390"><rect x="1197" y="261" width="3" height="114" fill="#CDB284"/><text x="1180" y="281" font-size="21" fill="#1C1914" font-weight="bold">أول من يسجّل يحتفظ به 30 يوماً</text><text x="1180" y="313" font-size="18" fill="#5E564B">تتجدد الحماية مع كل مكالمة أو<tspan x="1180" dy="28">معاينة أو عرض، ويُكتشف التكرار</tspan><tspan x="1180" dy="28">بالهاتف والبريد</tspan></text><rect x="1197" y="397" width="3" height="86" fill="#CDB284"/><text x="1180" y="417" font-size="21" fill="#1C1914" font-weight="bold">نزاعات تُحسم بالأدلة</text><text x="1180" y="449" font-size="18" fill="#5E564B">ترى إدارة المبيعات التسلسل الزمني<tspan x="1180" dy="28">كاملاً وتحسم بنقرة</tspan></text><rect x="1197" y="505" width="3" height="114" fill="#CDB284"/><text x="1180" y="525" font-size="21" fill="#1C1914" font-weight="bold">حجز واحد لكل وحدة</text><text x="1180" y="557" font-size="18" fill="#5E564B">حجز مؤقت يُلغى تلقائياً ما لم يصل<tspan x="1180" dy="28">العربون، والوكالة التالية في</tspan><tspan x="1180" dy="28">الطابور</tspan></text></g><g id="screen" data-pptx-bounds="72 142 656 416"><rect x="72" y="142" width="656" height="416" rx="16" fill="#FFFFFF" stroke="#CDB284" stroke-opacity="0.45" stroke-width="1" filter="url(#lift)"/><image href="../images/ar_brokers.jpg" x="80" y="150" width="640" height="400" preserveAspectRatio="xMidYMin slice" clip-path="url(#clip-screen)"/></g><g id="footer" data-pptx-bounds="80 676 300 24"><text x="80" y="694" font-size="13" fill="#5E564B" text-anchor="start" letter-spacing="2">OBSERVER AI</text></g>
</svg>
