<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="ar-SA" data-pptx-page-role="content" font-family="Segoe UI, IBM Plex Sans Arabic" text-anchor="end">
<defs><filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.14"/></filter><clipPath id="clip-board"><rect x="80" y="96" width="620" height="388" rx="10"/></clipPath></defs>
<rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F5F1EA"/>
<g id="header" data-pptx-bounds="760 80 440 238"><text x="1200" y="110" font-size="17" fill="#7A5A2B" font-weight="bold">منصة متكاملة</text><text x="1200" y="180" font-size="46" fill="#1C1914" font-family="Times New Roman, Amiri" font-weight="bold">رؤية كاملة، من<tspan x="1200" dy="58">الاستفسار إلى</tspan><tspan x="1200" dy="58">العمولة</tspan></text></g><g id="board" data-pptx-bounds="72 88 636 404"><rect x="72" y="88" width="636" height="404" rx="16" fill="#FFFFFF" stroke="#CDB284" stroke-opacity="0.45" stroke-width="1" filter="url(#lift)"/><image href="../images/ar_board.jpg" x="80" y="96" width="620" height="388" preserveAspectRatio="xMidYMin slice" clip-path="url(#clip-board)"/></g><g id="module-1" data-pptx-bounds="937 530 263 130"><rect x="1160" y="530" width="40" height="3" fill="#CDB284"/><text x="1200" y="568" font-size="21" fill="#1C1914" font-weight="bold">العملاء</text><text x="1200" y="602" font-size="16" fill="#5E564B">ملف واحد لكل عميل<tspan x="1200" dy="25">بالمحادثات والزيارات</tspan><tspan x="1200" dy="25">والمستندات</tspan></text></g><g id="module-2" data-pptx-bounds="651 530 263 130"><rect x="874" y="530" width="40" height="3" fill="#CDB284"/><text x="914" y="568" font-size="21" fill="#1C1914" font-weight="bold">الصفقات والعمولات</text><text x="914" y="602" font-size="16" fill="#5E564B">من الحجز إلى التوقيع، مع<tspan x="914" dy="25">عمولة كل طرف</tspan></text></g><g id="module-3" data-pptx-bounds="365 530 263 130"><rect x="588" y="530" width="40" height="3" fill="#CDB284"/><text x="628" y="568" font-size="21" fill="#1C1914" font-weight="bold">المشاريع والمخزون</text><text x="628" y="602" font-size="16" fill="#5E564B">الوحدات المتاحة وقوائم<tspan x="628" dy="25">الأسعار وخطط الدفع</tspan></text></g><g id="module-4" data-pptx-bounds="79 530 263 130"><rect x="302" y="530" width="40" height="3" fill="#CDB284"/><text x="342" y="568" font-size="21" fill="#1C1914" font-weight="bold">الوسطاء الشركاء</text><text x="342" y="602" font-size="16" fill="#5E564B">تسجيل العملاء والعمولات<tspan x="342" dy="25">لكل وسيط مع رقم رخصته</tspan></text></g><g id="lead" data-pptx-bounds="760 328 440 120"><text x="1200" y="364" font-size="20" fill="#5E564B">نظام إدارة علاقات العملاء مبني<tspan x="1200" dy="32">للعقار، يعمل فيه الذكاء الاصطناعي</tspan><tspan x="1200" dy="32">وفريقكم على السجل نفسه</tspan></text></g><g id="footer" data-pptx-bounds="80 676 300 24"><text x="80" y="694" font-size="13" fill="#5E564B" text-anchor="start" letter-spacing="2">OBSERVER AI</text></g>
</svg>
