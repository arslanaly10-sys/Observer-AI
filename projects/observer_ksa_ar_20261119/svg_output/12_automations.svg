<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" lang="ar-SA" data-pptx-page-role="content" font-family="Segoe UI, IBM Plex Sans Arabic" text-anchor="end">
<defs><filter id="lift" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000000" flood-opacity="0.14"/></filter><clipPath id="clip-screen"><rect x="80" y="150" width="640" height="400" rx="10"/></clipPath></defs>
<rect id="bg" data-pptx-role="background" x="0" y="0" width="1280" height="720" fill="#F5F1EA"/>
<g id="header" data-pptx-bounds="770 66 430 175"><text x="1200" y="96" font-size="17" fill="#7A5A2B" font-weight="bold">الأتمتة</text><rect x="984" y="76" width="118" height="28" rx="14" fill="#CDB284" fill-opacity="0.16" stroke="#CDB284" stroke-width="1"/><text x="1044" y="95" font-size="14" fill="#7A5A2B" font-weight="bold" text-anchor="middle">ذكاء اصطناعي</text><text x="1200" y="164" font-size="44" fill="#1C1914" font-family="Times New Roman, Amiri" font-weight="bold">مسارات عمل تعمل<tspan x="1200" dy="55">وحدها</tspan></text></g><g id="points" data-pptx-bounds="770 255 430 334"><rect x="1197" y="261" width="3" height="86" fill="#CDB284"/><text x="1180" y="281" font-size="21" fill="#1C1914" font-weight="bold">من الاستفسار إلى أول رد</text><text x="1180" y="313" font-size="18" fill="#5E564B">تحديد اللغة والتقييم والرد بالوحدات<tspan x="1180" dy="28">المطابقة، ثم المتابعة</tspan></text><rect x="1197" y="369" width="3" height="86" fill="#CDB284"/><text x="1180" y="389" font-size="21" fill="#1C1914" font-weight="bold">عناية بكبار العملاء</text><text x="1180" y="421" font-size="18" fill="#5E564B">إشعار الإدارة وتعيين مستشار أول<tspan x="1180" dy="28">خلال خمس دقائق، دون أسعار آلية</tspan></text><rect x="1197" y="477" width="3" height="86" fill="#CDB284"/><text x="1180" y="497" font-size="21" fill="#1C1914" font-weight="bold">متابعة المستندات والدفعات</text><text x="1180" y="529" font-size="18" fill="#5E564B">طلب الناقص، وتذكير المستشار، وتنبيه<tspan x="1180" dy="28">الإدارة بعد خمسة أيام</tspan></text></g><g id="note" data-pptx-bounds="770 599 430 101"><rect x="770" y="605" width="430" height="1" fill="#CDB284" fill-opacity="0.6"/><text x="1200" y="635" font-size="15" fill="#7A5A2B">كل مسار يمكن تجربته بأمان، دون إرسال أي رسالة<tspan x="1200" dy="22">لعميل حقيقي</tspan></text></g><g id="screen" data-pptx-bounds="72 142 656 416"><rect x="72" y="142" width="656" height="416" rx="16" fill="#FFFFFF" stroke="#CDB284" stroke-opacity="0.45" stroke-width="1" filter="url(#lift)"/><image href="../images/ar_auto.jpg" x="80" y="150" width="640" height="400" preserveAspectRatio="xMidYMin slice" clip-path="url(#clip-screen)"/></g><g id="footer" data-pptx-bounds="80 676 300 24"><text x="80" y="694" font-size="13" fill="#5E564B" text-anchor="start" letter-spacing="2">OBSERVER AI</text></g>
</svg>
