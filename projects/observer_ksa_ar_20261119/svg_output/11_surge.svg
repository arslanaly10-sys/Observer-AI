<g id="header" data-pptx-bounds="770 66 430 230"><text x="1200" y="96" font-size="17" fill="#CDB284" font-weight="bold">حين يفوق الطلب طاقة الفريق</text><rect x="785" y="76" width="118" height="28" rx="14" fill="#CDB284" fill-opacity="0.16" stroke="#CDB284" stroke-width="1"/><text x="844" y="95" font-size="14" fill="#CDB284" font-weight="bold" text-anchor="middle">ذكاء اصطناعي</text><text x="1200" y="164" font-size="44" fill="#F5F1EA" font-family="Times New Roman, Amiri" font-weight="bold">الجميع يتلقى<tspan x="1200" dy="55">رداً، والأهم</tspan><tspan x="1200" dy="55">يصل إلى موظف</tspan></text></g><g id="points" data-pptx-bounds="770 310 430 362"><rect x="1197" y="316" width="3" height="86" fill="#CDB284"/><text x="1180" y="336" font-size="21" fill="#F5F1EA" font-weight="bold">الموظفون لأعلى التقييمات</text><text x="1180" y="368" font-size="18" fill="#BDB3A3">يتولى المستشارون العملاء فوق الحد<tspan x="1180" dy="28">الذي تحددونه</tspan></text><rect x="1197" y="424" width="3" height="86" fill="#CDB284"/><text x="1180" y="444" font-size="21" fill="#F5F1EA" font-weight="bold">الوسطاء ومواعيد الاتصال</text><text x="1180" y="476" font-size="18" fill="#BDB3A3">من لا يصله الفريق يذهب إلى الوسطاء<tspan x="1180" dy="28">أو يحصل على موعد اتصال مؤكد</tspan></text><rect x="1197" y="532" width="3" height="114" fill="#CDB284"/><text x="1180" y="552" font-size="21" fill="#F5F1EA" font-weight="bold">العربون وحدود واتساب</text><text x="1180" y="584" font-size="18" fill="#BDB3A3">العربون يحدد ترتيب الاختيار<tspan x="1180" dy="28">والرسائل تبقى ضمن حدود واتساب</tspan><tspan x="1180" dy="28">اليومية</tspan></text></g><g id="screen" data-pptx-bounds="72 142 656 450"><rect x="72" y="142" width="656" height="416" rx="16" fill="#2A251E" stroke="#CDB284" stroke-opacity="0.45" stroke-width="1" filter="url(#lift)"/><image href="../images/ar_controls.jpg" x="80" y="150" width="640" height="400" preserveAspectRatio="xMidYMin slice" clip-path="url(#clip-screen)"/><text x="720" y="584" font-size=